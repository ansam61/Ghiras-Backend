<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="50%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>

    <!-- Leaf Main Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#a5d6a7" />
    </linearGradient>

    <!-- Glowing AI Tech Accent -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c8e6c9" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d3b10" flood-opacity="0.25" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer AI Tech Circuit Ring (Dotted AI Network) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 10" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- AI Circuit Nodes around the Plant -->
  <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.6" fill="none">
    <!-- Top AI Node -->
    <line x1="256" y1="96" x2="256" y2="135" />
    <circle cx="256" cy="96" r="7" fill="#ffffff" stroke="none" filter="url(#glow)" />

    <!-- Top Right Node -->
    <line x1="368" y1="144" x2="335" y2="175" />
    <circle cx="368" cy="144" r="6" fill="#ffffff" stroke="none" />

    <!-- Bottom Left Node -->
    <line x1="144" y1="368" x2="185" y2="335" />
    <circle cx="144" cy="368" r="6" fill="#ffffff" stroke="none" />
  </g>

  <!-- Main Plant Leaf Symbol (Ghiras Sprout + Digital Veins) -->
  <g filter="url(#shadow)">
    <!-- Right Leaf -->
    <path d="M256,384 C256,384 370,320 370,220 C370,140 290,110 256,125 C256,125 310,210 256,384 Z" fill="url(#leafGrad)" />

    <!-- Left Leaf -->
    <path d="M256,384 C256,384 142,320 142,225 C142,150 215,120 256,135 C256,135 205,215 256,384 Z" fill="#2e7d32" opacity="0.9" />

    <!-- Center Sprout Stem & Tech Nerve -->
    <path d="M256,390 Q256,240 256,120" stroke="url(#techGrad)" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Digital Leaf Vein Lines (AI Smart Grid) -->
    <path d="M256,260 Q295,235 325,220" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.8" />
    <circle cx="325" cy="220" r="5" fill="#ffffff" />

    <path d="M256,290 Q215,265 185,250" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.8" />
    <circle cx="185" cy="250" r="5" fill="#ffffff" />

    <path d="M256,200 Q285,180 305,170" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.8" />
    <circle cx="305" cy="170" r="4" fill="#ffffff" />
  </g>

  <!-- Golden Sprout Diamond (Growth & AI Precision) -->
  <polygon points="256,90 264,104 256,118 248,104" fill="#ffd54f" filter="url(#glow)" />
</svg>
